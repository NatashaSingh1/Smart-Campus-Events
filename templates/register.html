{% extends "base.html" %}{% block title %}Register{% endblock %}
{% block content %}<div class="auth"><div class="auth-box"><h1>Create account</h1><p>Student accounts can register for events.</p>
<form method="post"><label>Full Name</label><input name="name" required><label>Email</label><input name="email" type="email" required><label>Password</label><input name="password" type="password" minlength="6" required><button class="btn full">Create Account</button></form>
<p>Already registered? <a href="{{url_for('login')}}">Login</a></p></div></div>{% endblock %}
